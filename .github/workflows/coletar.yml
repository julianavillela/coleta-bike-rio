name: Coletar Bike Rio

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # permite rodar na mão pelo site

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar retrato das estações
        run: |
          mkdir -p dados
          DIA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          HORA=$(TZ=America/Sao_Paulo date "+%Y-%m-%d %H:%M:%S")
          ARQ="dados/status_$DIA.csv"
          curl -sS --retry 3 --max-time 60 \
            https://riodejaneiro.publicbikesystem.net/customer/gbfs/v2/en/station_status.json \
            | jq -r --arg h "$HORA" '.data.stations[] |
                [$h, .station_id, .num_bikes_available, .num_bikes_disabled,
                 .num_docks_available, .status, .last_reported] | @csv' > novo.csv
          if [ ! -f "$ARQ" ]; then
            echo '"coleta","station_id","num_bikes_available","num_bikes_disabled","num_docks_available","status","last_reported"' > "$ARQ"
          fi
          cat novo.csv >> "$ARQ"
          rm novo.csv

      - name: Salvar no repositório
        run: |
          git config user.name "coletor-bike-rio"
          git config user.email "actions@users.noreply.github.com"
          git add dados
          git commit -m "coleta $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nada novo"
          git push
